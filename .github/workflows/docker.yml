# Builds both images on every push and pull request, and publishes them to GHCR
# from main and from version tags. A PR gets the build as a check and pushes
# nothing.
#
# Both images build from the repo root — the workspace lockfile and schema/ sit
# above web/ and service/, so a package-scoped context cannot see them.

name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: web/Dockerfile
          - name: service
            dockerfile: service/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only when something is actually going to be pushed, so a PR from a fork
      # never needs the token.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only: the lockfile resolves @rolldown/binding-linux-x64-gnu and
          # nothing else, so an arm64 build has no binding for `vite build`.
          # Widening this means regenerating package-lock.json first.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # No secrets here: ANTHROPIC_API_KEY is a runtime variable on the
          # service container, and a build arg would be readable in the history.

  # Proves the pair actually runs, not just that two builds exited zero: the
  # browser's only route to the API is nginx forwarding /api/ to the service.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: The app shell is served
        run: |
          curl -sf -o /dev/null -w 'GET / → %{http_code}\n' http://localhost:8080/

      - name: /api/health answers through the nginx proxy
        run: |
          body=$(curl -sf http://localhost:8080/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: The app's origin is allowed through CORS
        run: |
          hdr=$(curl -sf -D- -o /dev/null \
                  -H 'Origin: http://localhost:8080' \
                  http://localhost:8080/api/health \
                | grep -i '^access-control-allow-origin:')
          echo "$hdr"
          echo "$hdr" | grep -qi 'http://localhost:8080'

      - name: A foreign origin is refused
        run: |
          # Reaching the service at all proves nginx forwards Origin; the 403
          # proves APP_ORIGIN is what decides.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -X POST http://localhost:8080/api/chat \
                   -H 'Origin: https://evil.test' \
                   -H 'Content-Type: application/json' \
                   -d '{}')
          echo "POST with foreign Origin → $code"
          test "$code" = "403"

      - name: Preflight is answered
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
                   http://localhost:8080/api/chat \
                   -H 'Origin: http://localhost:8080' \
                   -H 'Access-Control-Request-Method: POST')
          echo "OPTIONS → $code"
          test "$code" = "204"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
